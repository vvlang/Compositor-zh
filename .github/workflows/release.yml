name: Release

# 打一个 ad-hoc 签名的 DMG 并挂到 GitHub Release 上。
#
# 与上游 scripts/release.sh 的区别：那份需要 Developer ID 证书 + Apple 公证凭据，
# 密钥不能进仓库；这份用 ad-hoc 签名（不需要任何凭据），代价是没有公证，
# 用户首次打开要手动放行一次 Gatekeeper。README 的「如何绕过 Gatekeeper」一节有说明。
#
# 每个版本一个自己的 Release，附件也带版本号，互不干扰：
#
#   推到 main → 按 MARKETING_VERSION 发布/更新 `v<版本>`，同名附件用 --clobber
#               覆盖。版本号变了就是新 Release，版本号没变就只换那一份附件。
#               每次推送只动一个 Release，不会越堆越多。
#
#   打 v* tag → 发布一个按 tag 命名的 Release，用于固定某个构建。
#
#   手动触发 → 等同推 main，只是由人触发。
#
# `latest` 只作指针：它不带附件，只在说明里写明当前版本下载哪个。
# 早先的做法是让 `latest` 持有附件，结果每次升版本都留下一个旧 DMG
# （--clobber 只覆盖同名文件），下载页会同时列出一堆 1.4.8 / 1.4.10 / 1.5.1，
# 读者根本不知道该下哪个。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # 手动触发：Actions 页面点 Run workflow。版本号从 MARKETING_VERSION 读，不用手填。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # main 上连续推送时，只保留最后一次构建：前一个的产物已经没人要了。
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  dmg:
    name: build and publish DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # 打 ad-hoc 签名的 DMG。脚本自己会去掉 hardened runtime 再重签 ——
      # 不去掉的话 Sparkle.framework 会在启动时被 dyld 拒绝加载。
      - name: Build the DMG
        run: bash scripts/package-adhoc-dmg.sh

      - name: Collect version
        id: version
        run: |
          settings=$(xcodebuild -project Compositor.xcodeproj -scheme Compositor \
            -configuration Release -showBuildSettings 2>/dev/null)
          version=$(printf '%s\n' "$settings" | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          build=$(printf '%s\n' "$settings" | awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # appcast.xml 里的 sparkle:version 用的是 CFBundleVersion，不是 MARKETING_VERSION。
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # 打 tag 时沿用触发它的 tag；其余情况按 MARKETING_VERSION 发布，
          # 于是「同一个版本号」永远是同一个 Release，附件用 --clobber 覆盖。
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      # 每个版本一个 Release，所以「这个 tag 名被别的东西占了」才是问题——
      # 比如有人在 main 上直接 `git tag 1.4.6`（不带 v），而历史上真发过
      # `v1.4.6`，两个 Release 会指向同一个下载页，读者分不清。
      # Release 自己不存在时（绝大多数情况）不需要这一步。
      - name: Check whether the tag name is already taken
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，将更新它的附件。"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "⚠ tag $TAG 已存在但没有对应的 Release。"
            echo "  再发一个会让同一个下载页出现两条记录。请先删掉那个 tag，或"
            echo "  改 MARKETING_VERSION 让版本号继续往前走。"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          DMG: dist/Compositor-${{ steps.version.outputs.version }}.dmg
        run: |
          [[ -f "$DMG" ]] || { echo "No $DMG — the build step did not produce one."; exit 1; }
          checksum=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          {
            echo "由 GitHub Actions 自动构建的 ad-hoc 签名版本。"
            echo
            echo "**首次打开需要手动放行**：该构建没有 Apple Developer ID 签名，也没有公证，Gatekeeper 会拦截。"
            echo "在 Finder 里右键点击 app → 打开，或运行："
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine /Applications/Compositor.app"
            echo '```'
            echo
            echo "- 版本：$VERSION"
            echo "- SHA-256：\`$checksum\`"
            echo "- 构建自提交：\`$SHA\`"
            echo
            echo "同一个版本号每次推送只会替换这一份附件，历史版本各占一个 Release，"
            echo "不会互相覆盖。"
          } > notes.md

          title="Compositor $VERSION 中文版"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # 同版本重推：只换这一份附件。附件名带版本号，所以 --clobber
            # 覆盖的正是同一个版本——不会像早先的 `latest` 那样越积越多。
            gh release upload "$TAG" "$DMG" --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "$title" --notes-file notes.md --repo "${{ github.repository }}"
          else
            # ad-hoc 构建没有公证，标成 pre-release，避免让人以为是官方发布版。
            gh release create "$TAG" "$DMG" \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --prerelease \
              --notes-file notes.md
          fi

      # 留一份 Actions artifact：Release 附件被覆盖后，之前的构建就找不回来了，
      # 而 artifact 按 run 保留，事后还能翻出某一版。
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-${{ steps.version.outputs.version }}.dmg
          path: dist/Compositor-${{ steps.version.outputs.version }}.dmg
          retention-days: 90
          if-no-files-found: error

      # 签名并发布 Sparkle 更新源。走这一步才有自动更新：SUFeedURL 指向本仓库的
      # appcast.xml，Sparkle 用 SUPublicEDKey 里的公钥验签，私钥只存在于
      # GitHub Secret 里（经标准输入送给 sign_update，不落盘）。
      #
      # 钥匙串在 runner 上不存在——每次都是干净环境——所以必须显式喂私钥。
      # 没有这个 Secret 就跳过：DMG 照发，但没有 appcast.xml，不会提示更新。
      - name: Sign and publish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::notice title=未配置自动更新::没有 SPARKLE_PRIVATE_KEY，跳过签名。"
            exit 0
          fi
          # sign_update 由 Sparkle 这个 SPM 依赖带下来。构建那步用的 DerivedData
          # 路径是固定的（scripts/package-adhoc-dmg.sh 里 WORK 写死），runner 上
          # 也是同一个路径，所以直接找就行——不依赖本机缓存。
          export SIGN_UPDATE=$(find "$HOME/Library/Caches/CompositorAdhoc/DerivedData" \
            -name sign_update -type f -perm +111 2>/dev/null | head -1)
          [[ -x "$SIGN_UPDATE" ]] || { echo "::error::找不到 sign_update。"; exit 1; }
          echo "sign_update: $SIGN_UPDATE"

          bash scripts/publish-sparkle.sh \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}"

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Release $TAG"
            echo
            [[ -n "${VERSION}" ]] && echo "- 版本：$VERSION"
            if [[ -f "dist/Compositor-${VERSION}.dmg" ]]; then
              echo "- SHA-256：\`$(shasum -a 256 "dist/Compositor-${VERSION}.dmg" | cut -d' ' -f1)\`"
              echo "- 大小：$(du -h "dist/Compositor-${VERSION}.dmg" | cut -f1)"
            fi
            echo "- 签名：ad-hoc（无 Developer ID、无公证）"
          } >> "$GITHUB_STEP_SUMMARY"
